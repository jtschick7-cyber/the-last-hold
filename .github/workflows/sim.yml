# Technical design §11.2: the full 5-seed simulator suite. A stub until v0.1
# (plan T0.5); the simulator itself is a stub that exits 0.
name: Simulator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run sim:check
