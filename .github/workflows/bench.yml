# Technical design §11.2 and §14 (plan T2.19): performance benchmarks. The live
# odds panel (500 fights, budget 100 ms) and the Suggested party (budget 300 ms)
# run in Chromium with the CPU slowed 4×, as a stand-in for a mid-range phone.
# Over the budget is a warning in the test report; over 2× the budget fails.
name: Benchmarks

on:
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # D537: a stalled download from the Ubuntu mirror was the cause of the hangs, so apt gives up on
      # a slow download after 20 s and tries again (up to five times) instead of waiting for ever.
      - name: Make apt fail fast on a stalled download
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-fail-fast
      # D536: the same time limit and three tries as the e2e shards (D527, D535); this step hangs sometimes.
      - name: Install the test browser
        timeout-minutes: 6
        run: |
          for try in 1 2 3; do
            timeout 90 npx playwright install --with-deps chromium && exit 0
            echo "Browser install failed (try $try of 3)"
            # A hung try can leave apt-get holding the system lock, which fails every later try at once.
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            sleep 5
          done
          exit 1
      - run: npm run bench
