# Technical design §11.2: every push and pull request runs the check and a build.
# Playwright smoke and cross-engine determinism join from v0.1.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build -- --outDir dist-preview
        env:
          LH_CHANNEL: preview
