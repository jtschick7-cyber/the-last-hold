# Technical design §11.2: every push and pull request runs the check and a build,
# plus (from v0.1, plan T1.38) the Playwright phone smoke test and the
# determinism scenario in Chromium and WebKit.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Technical design §11.2: `npm run check` aims at 90 s or less. Timed as CI runs it (not counting
      # npm ci or the build). Over 90 s is a warning; over 120 s (D512) fails the job, because shared
      # runners vary by about 1.7x and a red check should mean a real problem.
      - name: npm run check (90 s budget, fails at 120 s)
        run: |
          start=$SECONDS
          npm run check
          elapsed=$((SECONDS - start))
          echo "npm run check took ${elapsed}s (budget 90s, fails at 120s)"
          if [ "$elapsed" -gt 120 ]; then
            echo "::error::npm run check took ${elapsed}s, over the 120 s limit"
            exit 1
          elif [ "$elapsed" -gt 90 ]; then
            echo "::warning::npm run check took ${elapsed}s, over the 90 s budget"
          fi
      - run: npm run build
      - run: npm run build -- --outDir dist-preview
        env:
          LH_CHANNEL: preview

  # D533: the browser tests run in four parallel shards (D537: tests are spread one by one; each worker
  # still checks its own sweep findings strictly). Nothing about which tests run
  # or how they pass changes.
  e2e-shards:
    name: e2e shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    # D552: a shard may run up to 8 minutes (D320's 5 minutes still holds for every other job).
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # D537: a stalled download from the Ubuntu mirror was the cause of the hangs, so apt gives up on
      # a slow download after 20 s and tries again (up to five times) instead of waiting for ever.
      - name: Make apt fail fast on a stalled download
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-fail-fast
      # D527: this step hangs about one run in three, so it gets a time limit and up to three tries.
      - name: Install the test browsers
        timeout-minutes: 6
        run: |
          for try in 1 2 3; do
            timeout 90 npx playwright install --with-deps chromium webkit && exit 0
            echo "Browser install failed (try $try of 3)"
            # A hung try can leave apt-get holding the system lock, which fails every later try at once.
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            sleep 5
          done
          exit 1
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4 --fully-parallel

  # The one name a branch rule can wait for: green only when all four shards are green.
  e2e:
    needs: e2e-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if [ "${{ needs.e2e-shards.result }}" != "success" ]; then
            echo "::error::The e2e shards finished as ${{ needs.e2e-shards.result }}"
            exit 1
          fi
