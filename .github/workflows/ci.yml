# Technical design §11.2: every push and pull request runs the check and a build,
# plus (from v0.1, plan T1.38) the Playwright phone smoke test and the
# determinism scenario in Chromium and WebKit.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Technical design §11.2: `npm run check` must finish in 90 s or less. Timed as CI runs it
      # (not counting npm ci or the build); a slow check fails the job.
      - name: npm run check (90 s budget)
        run: |
          start=$SECONDS
          npm run check
          elapsed=$((SECONDS - start))
          echo "npm run check took ${elapsed}s (budget 90s)"
          if [ "$elapsed" -gt 90 ]; then
            echo "::error::npm run check took ${elapsed}s, over the 90 s budget"
            exit 1
          fi
      - run: npm run build
      - run: npm run build -- --outDir dist-preview
        env:
          LH_CHANNEL: preview

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
